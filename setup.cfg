[metadata]
name = gitbacker
version = v0.0.0.1
description = Script for backing up github repos
long_description = file: README.md
long_description_content_type = text/markdown
url = https://codeberg.org/indigoparadox/gitbacker
protect_urls =
   Bug Tracker = https://codeber.org/indigoparadox/gitbacker/issues
classifiers =
   Programming Language :: Python :: 3
   Development Status :: 4 - Beta
   License :: OSI Approved :: GNU General Public License v3 (GPLv3)
   Operating System :: OS Independent

[options]
packages = find:
python_requires = >= 3.6
include_package_data = True
zip_safe = False
install_requires =
   six
   gitdb2
   GitPython
   requests

[options.entry_points]
console_scripts =
   gitbacker = gitbacker.__main__:main

